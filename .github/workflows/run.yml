name: Automatizacion Registro y Correo

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Instalar dependencias necesarias (requests y playwright)
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install firefox

      # 4. Ejecutar el script pasando los secretos como variables de entorno
      - name: Ejecutar script.py
        env:
          SIMPLELOGIN_API_KEY: ${{ secrets.SIMPLELOGIN_API_KEY }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          PROTON_USER: ${{ secrets.PROTON_USER }}
          PROTON_PASS: ${{ secrets.PROTON_PASS }}
        run: |
          python script.py
