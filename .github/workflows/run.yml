name: Automatización de Registro

on:
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          playwright install --with-deps firefox

      - name: Ejecutar script.py
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          GMX_USER: ${{ secrets.GMX_USER }}
          GMX_PASS: ${{ secrets.GMX_PASS }}
        run: |
          python script.py

      - name: Guardar resultado en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar result.json desde GitHub Actions [skip ci]"
          file_pattern: result.json
