<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Automático M3U</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; width: 350px; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        #status { margin-top: 20px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Generador M3U</h2>
        <p>Haz clic para iniciar el proceso de registro automático.</p>
        <button onclick="dispararAccion()">Ejecutar Automatización</button>
        <div id="status"></div>
    </div>

    <script>
        async function dispararAccion() {
            const statusDiv = document.getElementById("status");
            statusDiv.innerHTML = "Enviando orden a GitHub...";

            // Nota: Para seguridad, esto requiere un Personal Access Token (PAT) con permisos de repo/actions
            const GITHUB_USER = "TU_USUARIO_GITHUB";
            const REPO_NAME = "TU_NOMBRE_REPOSIRIO";
            const GITHUB_TOKEN = "TU_TOKEN_PERSONAL_GITHUB"; // Opcional si usas un backend ligero, pero necesario si se hace directo desde el navegador

            const url = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/actions/workflows/run.yml/dispatches`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ref: 'main' })
                });

                if (response.ok) {
                    statusDiv.innerHTML = "¡Proceso iniciado en GitHub! Revisa tu Telegram/Discord o los logs en unos segundos.";
                } else {
                    statusDiv.innerHTML = "Error al iniciar el workflow. Revisa los permisos del Token.";
                }
            } catch (error) {
                statusDiv.innerHTML = "Error de conexión: " + error.message;
            }
        }
    </script>
</body>
</html>
