name: Automatización de Registro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          playwright install --with-deps firefox

      - name: Ejecutar run.py
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          GMX_USER: ${{ secrets.GMX_USER }}
          GMX_PASS: ${{ secrets.GMX_PASS }}
        run: |
          python run.py

      - name: Guardar resultado y estado en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar resultados y alias usados [skip ci]"
          file_pattern: "result.json usados.json"
